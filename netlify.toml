# Static site: no bundling, publish the repository root as-is. The only build step
# stamps the commit hash and date into src/version.js (shown on the title screen).
[build]
  publish = "."
  command = "bash .github/scripts/stamp-version.sh src/version.js"

# Fresh code after every deploy (no stale cached modules after an update).
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep the whole site out of search engines (complements the robots meta tag and robots.txt).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# PWA: the service worker and manifest must always be revalidated so new
# versions are detected right after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Repository-only files (docs, tests, tooling, generator scripts) are published
# with the repo root, so hide them: a forced rewrite to a missing path returns 404
# even though the file exists. Game files (index.html, css/, src/, assets/*.png,
# sw.js, manifest.webmanifest) are not affected.
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/odd/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/assets/og/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/assets/icons/generate_icons.py"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404"
  status = 404
  force = true
