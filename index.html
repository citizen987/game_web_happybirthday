<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>David Dash</title>
<link rel="icon" href="head.png">
<style>
  :root {
    --b: clamp(54px, 17vh, 84px);
    --m: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b0b1a;
  }
  body {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: "Arial Black", "Trebuchet MS", system-ui, sans-serif;
  }
  #game {
    display: block;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .hidden { display: none !important; }

  /* Title screen */
  #start {
    background: linear-gradient(rgba(0, 0, 40, .1), rgba(0, 0, 40, .5));
    cursor: pointer;
  }
  .title-face {
    height: clamp(70px, 30vh, 210px);
    animation: bob 1s ease-in-out infinite alternate;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .35));
  }
  .title {
    margin: .1em 0 .2em;
    font-size: clamp(34px, 9vw, 96px);
    font-style: italic; font-weight: 900; letter-spacing: .05em;
    color: #ffd23a;
    text-shadow:
      3px 3px 0 #1d2b8f, -3px -3px 0 #1d2b8f, 3px -3px 0 #1d2b8f, -3px 3px 0 #1d2b8f,
      0 7px 0 #c0392b, 0 10px 14px rgba(0, 0, 0, .5);
  }
  .blink {
    margin: .2em 0;
    color: #fff; font-weight: 700;
    font-size: clamp(14px, 3.2vw, 26px);
    text-shadow: 2px 2px 0 #000;
    animation: blink 1s steps(2, start) infinite;
  }
  .help {
    margin: .4em 0 0;
    color: #dfe8ff; opacity: .9;
    font-family: system-ui, sans-serif; font-weight: 600;
    font-size: clamp(11px, 1.8vw, 15px);
    text-shadow: 1px 1px 0 #000;
  }
  body.touch .help { display: none; }
  @keyframes bob { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-10px) rotate(4deg); } }
  @keyframes blink { to { visibility: hidden; } }

  /* Victory screen */
  #win {
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0, 0, 40, .1), rgba(0, 0, 40, .55));
  }
  #win button { pointer-events: auto; }
  .big-face {
    height: clamp(90px, 42vh, 330px);
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .35));
    animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) backwards, wobble 1.4s ease-in-out .7s infinite;
  }
  #congrats {
    margin: .15em 0 .45em;
    font-size: clamp(22px, 5.6vw, 80px);
    font-weight: 900; line-height: 1.1; white-space: nowrap;
  }
  #congrats span {
    display: inline-block;
    animation: wave 1s ease-in-out infinite, rainbow 2s linear infinite;
    text-shadow:
      3px 3px 0 #1d2b8f, -2px -2px 0 #1d2b8f, 2px -2px 0 #1d2b8f, -2px 2px 0 #1d2b8f,
      0 6px 0 rgba(0, 0, 0, .35);
  }
  #again {
    font: inherit; font-weight: 900;
    font-size: clamp(16px, 3.2vw, 28px);
    padding: .55em 1.4em;
    border: 0; border-radius: 999px;
    background: #ffd23a; color: #1d2b8f;
    box-shadow: 0 5px 0 #c08a10, 0 8px 16px rgba(0, 0, 0, .4);
    cursor: pointer;
    animation: pop .5s .9s backwards;
  }
  #again:active { transform: translateY(3px); box-shadow: 0 2px 0 #c08a10; }
  @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.25em); } }
  @keyframes rainbow {
    0% { color: #ffd23a; } 25% { color: #ff5a5a; } 50% { color: #5affb0; }
    75% { color: #6ab8ff; } 100% { color: #ffd23a; }
  }
  @keyframes pop { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0); } }
  @keyframes wobble {
    0%, 100% { transform: rotate(-6deg) scale(1); }
    50% { transform: rotate(6deg) scale(1.06); }
  }

  /* Mute button */
  #mute {
    position: fixed; z-index: 30;
    top: calc(8px + env(safe-area-inset-top));
    right: calc(8px + env(safe-area-inset-right));
    width: 42px; height: 42px; padding: 7px;
    border-radius: 10px;
    border: 2px solid rgba(255, 255, 255, .55);
    background: rgba(0, 0, 0, .3);
    cursor: pointer;
  }
  #mute svg { width: 100%; height: 100%; fill: #fff; display: block; }

  /* Touch controls */
  #touch { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
  #touch.show { display: block; }
  body[data-state="title"] #touch, body[data-state="win"] #touch { display: none; }
  .tbtn {
    position: absolute;
    width: var(--b); height: var(--b);
    border-radius: 50%;
    background: rgba(255, 255, 255, .18);
    border: 2px solid rgba(255, 255, 255, .45);
    display: flex; align-items: center; justify-content: center;
  }
  .tbtn svg { width: 46%; height: 46%; fill: rgba(255, 255, 255, .85); }
  .tbtn.on { background: rgba(255, 255, 255, .45); }
  .tbtn[data-btn="left"] {
    left: calc(var(--m) + env(safe-area-inset-left));
    bottom: calc(var(--m) + var(--b) * .7 + env(safe-area-inset-bottom));
  }
  .tbtn[data-btn="down"] {
    left: calc(var(--m) + var(--b) + env(safe-area-inset-left));
    bottom: calc(var(--m) * .5 + env(safe-area-inset-bottom));
  }
  .tbtn[data-btn="right"] {
    left: calc(var(--m) + var(--b) * 2 + env(safe-area-inset-left));
    bottom: calc(var(--m) + var(--b) * .7 + env(safe-area-inset-bottom));
  }
  .tbtn[data-btn="jump"] {
    width: calc(var(--b) * 1.3); height: calc(var(--b) * 1.3);
    right: calc(var(--m) * 1.5 + env(safe-area-inset-right));
    bottom: calc(var(--m) * 1.5 + env(safe-area-inset-bottom));
  }

  /* Rotate notice */
  #rotate {
    position: fixed; inset: 0; z-index: 40;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #10183a; color: #fff;
    font-size: 22px; font-weight: 800; text-align: center; padding: 24px;
  }
  #rotate svg { width: 90px; height: 90px; fill: none; stroke: #ffd23a; stroke-width: 3; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
  }
</style>
</head>
<body data-state="title">
<canvas id="game" width="320" height="180"></canvas>

<div id="touch">
  <div class="tbtn" data-btn="left"><svg viewBox="0 0 24 24"><path d="M17 3 L5 12 L17 21 Z"/></svg></div>
  <div class="tbtn" data-btn="down"><svg viewBox="0 0 24 24"><path d="M3 7 L12 19 L21 7 Z"/></svg></div>
  <div class="tbtn" data-btn="right"><svg viewBox="0 0 24 24"><path d="M7 3 L19 12 L7 21 Z"/></svg></div>
  <div class="tbtn" data-btn="jump"><svg viewBox="0 0 24 24"><path d="M12 3 L22 14 L15.5 14 L15.5 21 L8.5 21 L8.5 14 L2 14 Z"/></svg></div>
</div>

<div id="start" class="overlay">
  <img src="head.png" alt="" class="title-face">
  <div class="title">DAVID DASH</div>
  <p class="blink">Toca o pulsa una tecla para empezar</p>
  <p class="help">Flechas / WASD para moverte &middot; Abajo para agacharte &middot; Espacio o Z para saltar &middot; M silencia</p>
</div>

<div id="win" class="overlay hidden">
  <img src="head.png" alt="David" class="big-face">
  <div id="congrats"></div>
  <button id="again" type="button">Volver a jugar</button>
</div>

<button id="mute" type="button" aria-label="Silenciar"></button>

<div id="rotate">
  <svg viewBox="0 0 48 48"><rect x="14" y="4" width="20" height="40" rx="3"/><line x1="21" y1="38" x2="27" y2="38"/></svg>
  <p>Gira el móvil para jugar</p>
</div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Canvas & scaling
  // ---------------------------------------------------------------------------
  const VIEW_H = 180;
  let VIEW_W = 320;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    VIEW_W = Math.max(240, Math.min(400, Math.round(VIEW_H * (w / h))));
    canvas.width = VIEW_W;
    canvas.height = VIEW_H;
    ctx.imageSmoothingEnabled = false;
    const scale = Math.min(w / VIEW_W, h / VIEW_H);
    canvas.style.width = Math.floor(VIEW_W * scale) + 'px';
    canvas.style.height = Math.floor(VIEW_H * scale) + 'px';
    layoutTouch();
  }

  // ---------------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------------
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------------------------------------------------------------------------
  // Head sprite (head.png, opaque bbox measured offline: 0,18 256x220)
  // ---------------------------------------------------------------------------
  const HEAD_SRC = { x: 0, y: 18, w: 256, h: 220 };
  const HEAD_INNER_W = 28;
  const HEAD_INNER_H = Math.round(HEAD_INNER_W * HEAD_SRC.h / HEAD_SRC.w);
  const HEAD_W = HEAD_INNER_W + 2;
  const HEAD_FACE_X = 22;   // face center inside the right-facing sprite
  const HEAD_CHIN_Y = 21;   // chin row inside the sprite
  let headR = null;
  let headL = null;

  function buildHeadSprite(img) {
    let cur = document.createElement('canvas');
    cur.width = HEAD_SRC.w; cur.height = HEAD_SRC.h;
    cur.getContext('2d').drawImage(img, HEAD_SRC.x, HEAD_SRC.y, HEAD_SRC.w, HEAD_SRC.h, 0, 0, HEAD_SRC.w, HEAD_SRC.h);
    let cw = cur.width, ch = cur.height;
    while (cw / 2 > HEAD_INNER_W) {
      const nw = Math.round(cw / 2), nh = Math.round(ch / 2);
      const n = document.createElement('canvas');
      n.width = nw; n.height = nh;
      const nc = n.getContext('2d');
      nc.imageSmoothingEnabled = true; nc.imageSmoothingQuality = 'high';
      nc.drawImage(cur, 0, 0, nw, nh);
      cur = n; cw = nw; ch = nh;
    }
    const out = document.createElement('canvas');
    out.width = HEAD_W; out.height = HEAD_INNER_H + 2;
    const oc = out.getContext('2d');
    oc.imageSmoothingEnabled = true; oc.imageSmoothingQuality = 'high';
    oc.drawImage(cur, 1, 1, HEAD_INNER_W, HEAD_INNER_H);
    // Harden alpha and add a dark 1px outline for a pixel-art look.
    // getImageData throws on file:// (tainted canvas); the soft sprite is still usable.
    try {
      const W = out.width, H = out.height;
      const d = oc.getImageData(0, 0, W, H);
      const px = d.data;
      const solid = new Uint8Array(W * H);
      for (let i = 0; i < W * H; i++) solid[i] = px[i * 4 + 3] > 110 ? 1 : 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (solid[i]) { px[i * 4 + 3] = 255; continue; }
          const edge = (x > 0 && solid[i - 1]) || (x < W - 1 && solid[i + 1]) ||
                       (y > 0 && solid[i - W]) || (y < H - 1 && solid[i + W]);
          if (edge) { px[i * 4] = 26; px[i * 4 + 1] = 16; px[i * 4 + 2] = 48; px[i * 4 + 3] = 255; }
          else px[i * 4 + 3] = 0;
        }
      }
      oc.putImageData(d, 0, 0);
    } catch (e) { /* keep smooth sprite */ }
    const flipped = document.createElement('canvas');
    flipped.width = out.width; flipped.height = out.height;
    const fc = flipped.getContext('2d');
    fc.scale(-1, 1);
    fc.drawImage(out, -out.width, 0);
    headR = out;
    headL = flipped;
  }
  const headImg = new Image();
  headImg.onload = () => buildHeadSprite(headImg);
  headImg.onerror = () => console.error('head.png could not be loaded');
  headImg.src = 'head.png';

  // ---------------------------------------------------------------------------
  // Audio (WebAudio, generated)
  // ---------------------------------------------------------------------------
  let actx = null, master = null, musicGain = null, sfxGain = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('dd-muted') === '1'; } catch (e) { /* storage blocked */ }
  const MASTER_VOL = 0.5;

  function initAudio() {
    if (actx) {
      if (actx.state !== 'running') actx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : MASTER_VOL;
    master.connect(actx.destination);
    musicGain = actx.createGain();
    musicGain.gain.value = 0.4;
    musicGain.connect(master);
    sfxGain = actx.createGain();
    sfxGain.gain.value = 0.8;
    sfxGain.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    // iOS unlock: play a silent buffer inside the gesture
    const s = actx.createBufferSource();
    s.buffer = actx.createBuffer(1, 1, 22050);
    s.connect(actx.destination);
    s.start(0);
    if (actx.state !== 'running') actx.resume();
  }

  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function tone(at, f, f2, dur, type, vol, dest) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, at);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g);
    g.connect(dest || sfxGain);
    o.start(at);
    o.stop(at + dur + 0.05);
  }

  function noise(at, dur, vol, freq, ftype, dest) {
    const s = actx.createBufferSource();
    s.buffer = noiseBuf;
    const f = actx.createBiquadFilter();
    f.type = ftype;
    f.frequency.value = freq;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfxGain);
    s.start(at, Math.random() * 0.5);
    s.stop(at + dur + 0.05);
  }

  const sfx = {
    jump() { if (!actx) return; const t = actx.currentTime; tone(t, 280, 660, 0.14, 'square', 0.16); },
    coin() {
      if (!actx) return; const t = actx.currentTime;
      tone(t, 988, null, 0.07, 'square', 0.13);
      tone(t + 0.07, 1319, null, 0.22, 'square', 0.13);
    },
    stomp() {
      if (!actx) return; const t = actx.currentTime;
      tone(t, 520, 120, 0.14, 'square', 0.2);
      noise(t, 0.08, 0.2, 1200, 'lowpass');
    },
    hit() {
      if (!actx) return; const t = actx.currentTime;
      tone(t, 440, 70, 0.4, 'sawtooth', 0.2);
      noise(t, 0.25, 0.25, 900, 'lowpass');
    },
    fall() { if (!actx) return; const t = actx.currentTime; tone(t, 900, 110, 0.55, 'square', 0.14); },
    checkpoint() {
      if (!actx) return; const t = actx.currentTime;
      [660, 880, 1320].forEach((f, i) => tone(t + i * 0.08, f, null, 0.16, 'triangle', 0.25));
    },
    goal() {
      if (!actx) return; const t = actx.currentTime;
      const seq = [[72, 0.12], [76, 0.12], [79, 0.12], [84, 0.3], [79, 0.12], [84, 0.12], [88, 0.7]];
      let at = t;
      for (const [n, d] of seq) {
        tone(at, midi(n), null, d * 0.95, 'square', 0.14);
        tone(at, midi(n - 12), null, d * 0.95, 'triangle', 0.2);
        at += d;
      }
    },
    firework() {
      if (!actx) return; const t = actx.currentTime;
      tone(t, 900, 200, 0.25, 'triangle', 0.08);
      noise(t + 0.2, 0.45, 0.25, 1400, 'lowpass');
    },
  };

  // Original chiptune loop: C - Am - F - G, eighth-note steps
  const BPM = 150;
  const STEP_DUR = 60 / BPM / 2;
  const MELODY = [
    72, 0, 76, 79, 0, 79, 77, 76,
    76, 0, 72, 69, 0, 72, 74, 76,
    77, 0, 77, 81, 0, 79, 77, 76,
    74, 0, 74, 79, 0, 77, 76, 74,
    72, 0, 76, 79, 0, 84, 83, 81,
    79, 0, 76, 72, 0, 76, 77, 79,
    81, 79, 77, 76, 74, 76, 77, 74,
    79, 77, 76, 74, 71, 0, 67, 0,
  ];
  const BASS_ROOTS = [48, 45, 41, 43, 48, 45, 41, 43];
  const BASS_PATTERN = [0, 12, 7, 12, 0, 12, 7, 12];
  let musicTimer = null, nextNoteTime = 0, musicStep = 0;

  function playStep(step, at) {
    const m = MELODY[step];
    if (m) {
      const hold = MELODY[(step + 1) % MELODY.length] === 0 ? 1.8 : 0.85;
      tone(at, midi(m), null, STEP_DUR * hold, 'square', 0.12, musicGain);
    }
    const root = BASS_ROOTS[Math.floor(step / 8)];
    tone(at, midi(root + BASS_PATTERN[step % 8]), null, STEP_DUR * 0.9, 'triangle', 0.3, musicGain);
    if (step % 4 === 0) tone(at, 160, 45, 0.1, 'triangle', 0.35, musicGain);
    if (step % 8 === 4) noise(at, 0.08, 0.12, 2200, 'bandpass', musicGain);
    if (step % 2 === 1) noise(at, 0.03, 0.05, 7000, 'highpass', musicGain);
  }

  function scheduler() {
    if (!actx || actx.state !== 'running') return;
    if (nextNoteTime < actx.currentTime - 0.2) nextNoteTime = actx.currentTime + 0.05;
    while (nextNoteTime < actx.currentTime + 0.12) {
      playStep(musicStep, nextNoteTime);
      nextNoteTime += STEP_DUR;
      musicStep = (musicStep + 1) % MELODY.length;
    }
  }
  function startMusic() {
    if (!actx) return;
    stopMusic();
    musicStep = 0;
    nextNoteTime = actx.currentTime + 0.1;
    musicTimer = setInterval(scheduler, 25);
  }
  function stopMusic() {
    if (musicTimer) clearInterval(musicTimer);
    musicTimer = null;
  }

  const muteBtn = document.getElementById('mute');
  const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  function renderMute() {
    muteBtn.innerHTML = muted ? ICON_OFF : ICON_ON;
    muteBtn.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
  }
  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('dd-muted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ }
    if (master) master.gain.setTargetAtTime(muted ? 0 : MASTER_VOL, actx.currentTime, 0.02);
    renderMute();
  }
  muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });
  muteBtn.addEventListener('pointerup', (e) => e.stopPropagation());
  muteBtn.addEventListener('touchend', (e) => e.stopPropagation());
  renderMute();

  document.addEventListener('visibilitychange', () => {
    if (!actx) return;
    if (document.hidden) actx.suspend();
    else actx.resume();
  });

  // ---------------------------------------------------------------------------
  // Level geometry
  // ---------------------------------------------------------------------------
  const segs = [];
  let levelEnd = 0;
  let bx = 0, by = 150;
  const flat = (len) => { segs.push({ x0: bx, y0: by, x1: bx + len, y1: by }); bx += len; };
  const ramp = (len, dy) => { segs.push({ x0: bx, y0: by, x1: bx + len, y1: by + dy }); bx += len; by += dy; };
  const gap = (len, dy = 0) => { bx += len; by += dy; };

  function segIndexAt(x) {
    let lo = 0, hi = segs.length - 1;
    while (lo <= hi) {
      const m = (lo + hi) >> 1;
      const s = segs[m];
      if (x < s.x0) hi = m - 1;
      else if (x >= s.x1) lo = m + 1;
      else return m;
    }
    return -1;
  }
  function groundAt(x) {
    const i = segIndexAt(x);
    if (i < 0) return null;
    const s = segs[i];
    return s.y0 + (s.y1 - s.y0) * (x - s.x0) / (s.x1 - s.x0);
  }
  function slopeAt(x) {
    const i = segIndexAt(x);
    if (i < 0) return 0;
    const s = segs[i];
    return (s.y1 - s.y0) / (s.x1 - s.x0);
  }

  const def = { coins: [], enemies: [], platforms: [], checkpoints: [], deco: [], flagX: 0 };

  function buildLevel() {
    const M = {};
    const mark = (k) => { M[k] = bx; };

    flat(440);
    mark('a'); ramp(140, -36);
    flat(200);
    mark('b'); ramp(180, 36);
    mark('c'); flat(320);
    mark('g1'); gap(72);
    mark('d'); flat(340);
    mark('e'); ramp(120, -30);
    flat(150);
    mark('g2'); gap(110);
    mark('f'); flat(260);
    mark('h'); ramp(220, 40);
    mark('i'); flat(440);
    ramp(120, -40);
    mark('g3'); gap(100);
    mark('j'); flat(320);
    mark('k'); ramp(300, 30);
    mark('l'); flat(220);
    mark('g4'); gap(60);
    mark('m'); flat(120);
    mark('g5'); gap(60);
    mark('n'); flat(280);
    mark('o'); ramp(160, -50);
    mark('p'); flat(280);
    mark('q'); ramp(260, 60);
    mark('r'); flat(380);
    mark('g6'); gap(124, -10);
    mark('s'); flat(300);
    ramp(140, -30);
    mark('t'); flat(220);
    ramp(140, 30);
    mark('u'); flat(560);
    levelEnd = bx;
    def.flagX = levelEnd - 70;

    const coin = (x, y) => def.coins.push({ x: Math.round(x), y: Math.round(y) });
    const row = (x, n, dx = 20, h = 16) => {
      for (let i = 0; i < n; i++) {
        const g = groundAt(x + i * dx);
        if (g !== null) coin(x + i * dx, g - h);
      }
    };
    const arc = (x0, x1, n, baseY, peak) => {
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        coin(x0 + (x1 - x0) * t, baseY - peak * 4 * t * (1 - t));
      }
    };
    const plat = (x, y, w, range = 0, speed = 0) => {
      def.platforms.push({ x0: x, y, w, range, speed });
      return { x, y, w };
    };
    const crab = (min, max) => def.enemies.push({ type: 'crab', x: (min + max) / 2, min, max });
    const bee = (min, max, y0) => def.enemies.push({ type: 'bee', x: (min + max) / 2, min, max, y0 });

    // Coins
    row(100, 5);
    row(M.a + 10, 6, 22);
    row(M.a + 160, 6);
    row(M.b + 20, 7, 24);
    arc(M.g1 - 36, M.g1 + 108, 7, 134, 42);
    row(M.d + 40, 8);
    row(M.f + 40, 6, 22);
    row(M.h + 10, 8, 26);
    row(M.j + 30, 6, 24);
    row(M.k + 10, 10, 28);
    row(M.l + 30, 6, 22);
    arc(M.g4 - 20, M.g4 + 80, 5, 134, 30);
    arc(M.g5 - 20, M.g5 + 80, 5, 134, 30);
    row(M.n + 40, 8, 22);
    row(M.o + 10, 6, 26);
    row(M.p + 20, 4);
    row(M.q + 10, 9, 28);
    row(M.r + 40, 10, 30);
    row(M.s + 60, 8, 22);
    row(M.t + 20, 8, 24);
    row(M.u + 40, 14, 26);

    // Platforms
    const p1 = plat(M.g2 + 30, 100, 50);
    for (let i = 0; i < 3; i++) coin(p1.x + 11 + i * 14, p1.y - 14);
    [plat(M.i + 60, 130, 44), plat(M.i + 140, 104, 44), plat(M.i + 220, 78, 44)].forEach((pl) => {
      coin(pl.x + 15, pl.y - 12);
      coin(pl.x + 29, pl.y - 12);
    });
    for (let i = 0; i < 4; i++) coin(M.i + 226 + i * 11, 52);
    plat(M.g3 + 30, 112, 40, 30, 0.025);
    const p2 = plat(M.p + 110, 56, 60);
    for (let i = 0; i < 4; i++) coin(p2.x + 9 + i * 14, p2.y - 12);
    const p3 = plat(M.g6 + 10, 136, 36);
    const p4 = plat(M.g6 + 74, 124, 36);
    coin(p3.x + 20, p3.y - 14);
    coin(p4.x + 20, p4.y - 14);

    // Enemies
    crab(M.c + 40, M.c + 300);
    bee(M.d + 60, M.d + 300, 112);
    crab(M.f + 30, M.f + 240);
    crab(M.i + 20, M.i + 420);
    bee(M.i + 100, M.i + 380, 136);
    crab(M.j + 100, M.j + 200);
    crab(M.j + 210, M.j + 310);
    bee(M.l + 20, M.l + 200, 122);
    crab(M.n + 40, M.n + 260);
    crab(M.r + 20, M.r + 180);
    crab(M.r + 200, M.r + 370);
    bee(M.r + 60, M.r + 340, 124);
    crab(M.t + 20, M.t + 200);
    bee(M.u + 60, M.u + 240, 122);
    crab(M.u + 100, M.u + 380);
    bee(M.u + 260, M.u + 420, 110);

    // Checkpoints
    def.checkpoints.push(M.e + 140, M.i + 380, M.j + 40, M.l + 40, M.p + 30, M.s + 40);

    // Decoration (deterministic)
    const rng = mulberry32(7);
    let x = 80;
    while (x < levelEnd - 60) {
      x += 20 + rng() * 50;
      const g = groundAt(x);
      if (g === null || groundAt(x - 10) === null || groundAt(x + 10) === null) continue;
      const r = rng();
      const type = r < 0.35 ? 'flower' : r < 0.55 ? 'tuft' : r < 0.75 ? 'bush' : r < 0.88 ? 'rock' : 'palm';
      const colors = ['#ff5a8a', '#ffd23a', '#ffffff', '#b07aff'];
      def.deco.push({ x: Math.round(x), y: Math.round(g), type, c: colors[Math.floor(rng() * colors.length)] });
    }
  }
  buildLevel();

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------
  const ACC = 0.09, DECEL = 0.35, FRIC = 0.07, CROUCH_FRIC = 0.1, TOP = 3.6, MAX_V = 6;
  const AIR_ACC = 0.1, GRAV = 0.21, JUMP_V = -5.0, JUMP_CUT = -2.2, MAX_FALL = 6;
  const SLOPE_G = 0.12, STEP_UP = 10, SNAP = 10, HW = 5, H_STAND = 26, H_CROUCH = 16;
  const DEATH_Y = 250, START_X = 60;
  const CAM_MIN_Y = -60, CAM_MAX_Y = 18;

  let state = 'title';
  let tick = 0;
  let player, coins, enemies, platforms, checkpoints, lastCP;
  let lost = [], particles = [], confetti = [];
  let coinCount = 0;
  let camX = 0, camY = 0, look = 0;
  let fade = 0, shake = 0;
  let winT = 0, winShown = false;

  function newPlayer(x) {
    return {
      x, y: groundAt(x), vx: 0, vy: 0, face: 1,
      onGround: true, onPlat: null, slope: 0, crouch: false,
      coyote: 0, jumpBuf: 0, hurt: false, inv: 0, runT: 0,
      prevY: 0, vyPre: 0,
    };
  }

  function resetLevel() {
    coins = def.coins.map((c) => ({ x: c.x, y: c.y, taken: false }));
    enemies = def.enemies.map((e) => ({ ...e, alive: true, dir: -1, t: Math.floor(Math.random() * 100), y: e.y0 || 0 }));
    platforms = def.platforms.map((p) => ({ ...p, x: p.x0, dx: 0 }));
    checkpoints = def.checkpoints.map((x) => ({ x, y: groundAt(x), on: false }));
    lastCP = { x: START_X };
    coinCount = 0;
    lost = []; particles = []; confetti = [];
    player = newPlayer(START_X);
    winT = 0; winShown = false; fade = 0; shake = 0; look = 0;
    updateCamera(true);
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  const keys = { left: false, right: false, down: false, jump: false };
  const tstate = { left: false, right: false, down: false, jump: false };
  let jumpQueued = false;
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyZ: 'jump', ArrowUp: 'jump', KeyW: 'jump',
  };

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyM') { toggleMute(); return; }
    const k = KEYMAP[e.code];
    if (state === 'title') {
      if (!e.repeat) startGame();
      if (k) e.preventDefault();
      return;
    }
    if (state === 'win' && winShown && (e.code === 'Enter' || k === 'jump') && !e.repeat) {
      e.preventDefault();
      restart();
      return;
    }
    if (!k) return;
    e.preventDefault();
    if (k === 'jump' && !keys.jump) jumpQueued = true;
    keys[k] = true;
  });
  window.addEventListener('keyup', (e) => {
    const k = KEYMAP[e.code];
    if (k) keys[k] = false;
  });
  window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    tpointers.clear();
    refreshTouch();
  });

  const touchEl = document.getElementById('touch');
  const btnEls = Array.from(touchEl.querySelectorAll('.tbtn'));
  let btnGeo = [];
  const tpointers = new Map();
  const isTouchDevice = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;

  function layoutTouch() {
    btnGeo = btnEls.map((el) => {
      const r = el.getBoundingClientRect();
      return { name: el.dataset.btn, cx: r.left + r.width / 2, cy: r.top + r.height / 2, r: r.width / 2 };
    });
  }
  function hitBtn(x, y) {
    let best = null, bestD = Infinity;
    for (const b of btnGeo) {
      if (b.r <= 0) continue;
      const d = Math.hypot(x - b.cx, y - b.cy) / b.r;
      if (d < 1.35 && d < bestD) { bestD = d; best = b.name; }
    }
    return best;
  }
  function refreshTouch() {
    const wasJump = tstate.jump;
    for (const k in tstate) tstate[k] = false;
    for (const v of tpointers.values()) if (v) tstate[v] = true;
    if (tstate.jump && !wasJump) jumpQueued = true;
    for (const el of btnEls) el.classList.toggle('on', tstate[el.dataset.btn]);
  }
  function enableTouchUI() {
    if (touchEl.classList.contains('show')) return;
    touchEl.classList.add('show');
    document.body.classList.add('touch');
    layoutTouch();
  }
  if (isTouchDevice && window.matchMedia('(pointer: coarse)').matches) enableTouchUI();

  window.addEventListener('pointerdown', (e) => {
    if (actx && actx.state !== 'running') actx.resume();
    if (e.pointerType === 'touch') enableTouchUI();
    if (state !== 'play' || !touchEl.classList.contains('show')) return;
    if (e.target instanceof Node && muteBtn.contains(e.target)) return;
    tpointers.set(e.pointerId, hitBtn(e.clientX, e.clientY));
    refreshTouch();
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('pointermove', (e) => {
    if (!tpointers.has(e.pointerId)) return;
    const b = hitBtn(e.clientX, e.clientY);
    if (b !== tpointers.get(e.pointerId)) {
      tpointers.set(e.pointerId, b);
      refreshTouch();
    }
  });
  const endPointer = (e) => {
    if (!tpointers.has(e.pointerId)) return;
    tpointers.delete(e.pointerId);
    refreshTouch();
  };
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // Block page zoom / scroll gestures
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const portraitMQ = window.matchMedia('(orientation: portrait) and (pointer: coarse)');

  // ---------------------------------------------------------------------------
  // Screens
  // ---------------------------------------------------------------------------
  const startEl = document.getElementById('start');
  const winEl = document.getElementById('win');
  const congratsEl = document.getElementById('congrats');

  function setState(s) {
    state = s;
    document.body.dataset.state = s;
    if (s === 'play') layoutTouch();
  }

  function startGame() {
    if (state !== 'title') return;
    initAudio();
    if (isTouchDevice) {
      const el = document.documentElement;
      const rq = el.requestFullscreen || el.webkitRequestFullscreen;
      if (rq) {
        try {
          const pr = rq.call(el, { navigationUI: 'hide' });
          if (pr && pr.then) {
            pr.then(() => {
              if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            }).catch(() => {});
          }
        } catch (err) { /* fullscreen not allowed */ }
      }
    }
    startEl.classList.add('hidden');
    resetLevel();
    setState('play');
    startMusic();
  }
  startEl.addEventListener('pointerup', startGame);
  startEl.addEventListener('touchend', startGame);
  startEl.addEventListener('click', startGame);

  function showWin() {
    winShown = true;
    congratsEl.innerHTML = '';
    Array.from('¡FELICIDADES, DAVID!').forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.animationDelay = `${i * 0.06}s, ${i * 0.1}s`;
      congratsEl.appendChild(s);
    });
    winEl.classList.remove('hidden');
  }

  function restart() {
    winEl.classList.add('hidden');
    tpointers.clear();
    refreshTouch();
    resetLevel();
    setState('play');
    startMusic();
  }
  document.getElementById('again').addEventListener('click', () => { initAudio(); restart(); });

  function triggerWin() {
    setState('win');
    winT = 0;
    stopMusic();
    sfx.goal();
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  function spawnParticles(x, y, n, colors, speed, grav, life) {
    for (let i = 0; i < n; i++) {
      if (particles.length > 500) particles.shift();
      const a = Math.random() * Math.PI * 2;
      const sp = rand(speed * 0.4, speed);
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: grav,
        life: life + Math.floor(Math.random() * 20), max: life + 20,
        c: colors[Math.floor(Math.random() * colors.length)], s: Math.random() < 0.3 ? 2 : 1,
      });
    }
  }

  function spillCoins(n) {
    const p = player;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i % 2 ? 1 : -1) * (0.3 + (i / n) * 1.1);
      const sp = 2.2 + (i % 3) * 0.6;
      lost.push({ x: p.x, y: p.y - 14, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.5, age: 0 });
    }
  }

  function hurtPlayer(srcX) {
    const p = player;
    if (p.inv > 0 || state !== 'play') return;
    spillCoins(Math.min(coinCount, 24));
    coinCount = 0;
    p.hurt = true; p.onGround = false; p.onPlat = null; p.crouch = false;
    p.vy = -3.6;
    p.vx = (p.x < srcX ? -1 : 1) * 2.2;
    p.inv = 120;
    shake = 8;
    sfx.hit();
  }

  function respawn() {
    player = newPlayer(lastCP.x);
    player.inv = 60;
    fade = 24;
    look = 0;
    sfx.fall();
    updateCamera(true);
  }

  function updatePlatforms() {
    for (const pl of platforms) {
      if (!pl.range) { pl.dx = 0; continue; }
      const nx = pl.x0 + Math.sin(tick * pl.speed) * pl.range;
      pl.dx = nx - pl.x;
      pl.x = nx;
    }
  }

  function updatePlayer(jp) {
    const p = player;
    const ctrl = state === 'play' && !p.hurt;
    const L = ctrl && (keys.left || tstate.left);
    const R = ctrl && (keys.right || tstate.right);
    const D = ctrl && (keys.down || tstate.down);
    const J = ctrl && (keys.jump || tstate.jump);
    const ix = (R ? 1 : 0) - (L ? 1 : 0);

    if (ctrl && jp) p.jumpBuf = 7;
    else if (p.jumpBuf > 0) p.jumpBuf--;
    p.coyote = p.onGround ? 7 : Math.max(0, p.coyote - 1);
    p.crouch = p.onGround && D;

    if (p.onGround) {
      p.vx += p.slope * SLOPE_G;
      if (p.crouch) p.vx = approach(p.vx, 0, CROUCH_FRIC);
      else if (ix !== 0) {
        if (ix * p.vx < 0) p.vx += ix * DECEL;
        else if (Math.abs(p.vx) < TOP) p.vx = ix * Math.min(Math.abs(p.vx) + ACC, TOP);
        else p.vx = approach(p.vx, ix * TOP, 0.02);
      } else p.vx = approach(p.vx, 0, FRIC);
    } else if (ix !== 0 && ix * p.vx < TOP) {
      p.vx = ix * Math.min(ix * p.vx + AIR_ACC, TOP);
    }
    if (state === 'win') p.vx *= 0.9;
    p.vx = clamp(p.vx, -MAX_V, MAX_V);
    if (ix !== 0) p.face = ix;

    if (p.jumpBuf > 0 && p.coyote > 0) {
      p.vy = JUMP_V;
      p.onGround = false; p.onPlat = null;
      p.coyote = 0; p.jumpBuf = 0; p.crouch = false;
      sfx.jump();
    }

    // Horizontal movement with wall check against higher ground
    p.prevY = p.y;
    if (p.onPlat) p.x += p.onPlat.dx;
    let nx = p.x + p.vx;
    if (p.vx !== 0) {
      const gl = groundAt(nx + Math.sign(p.vx) * HW);
      if (gl !== null && gl < p.y - STEP_UP) { nx = p.x; p.vx = 0; }
    }
    p.x = clamp(nx, HW, levelEnd - HW);

    // Vertical: stay on support or fall
    if (p.onGround) {
      if (p.onPlat) {
        const pl = p.onPlat;
        if (p.x + HW < pl.x || p.x - HW > pl.x + pl.w) { p.onGround = false; p.onPlat = null; }
        else { p.y = pl.y; p.slope = 0; }
      } else {
        const g = groundAt(p.x);
        if (g !== null && g <= p.y + SNAP) { p.y = g; p.slope = slopeAt(p.x); }
        else { p.onGround = false; p.slope = 0; }
      }
    }

    p.vyPre = p.vy;
    if (!p.onGround) {
      if (ctrl && !J && p.vy < JUMP_CUT) p.vy = JUMP_CUT;
      p.vy = Math.min(p.vy + GRAV, MAX_FALL);
      p.vyPre = p.vy;
      let ny = p.y + p.vy;
      let landY = null, landPlat = null;
      const g = groundAt(p.x);
      if (g !== null && ny >= g && p.y <= g + STEP_UP) {
        if (p.vy >= 0) landY = g;
        else ny = g;
      }
      if (p.vy >= 0) {
        for (const pl of platforms) {
          if (p.x + HW > pl.x && p.x - HW < pl.x + pl.w && p.y <= pl.y + 0.5 && ny >= pl.y) {
            if (landY === null || pl.y < landY) { landY = pl.y; landPlat = pl; }
          }
        }
      }
      if (landY !== null) {
        p.y = landY; p.vy = 0;
        p.onGround = true; p.onPlat = landPlat;
        p.slope = landPlat ? 0 : slopeAt(p.x);
        if (p.hurt) { p.hurt = false; p.vx *= 0.3; }
      } else p.y = ny;
    }

    if (p.onGround && Math.abs(p.vx) > 0.1) p.runT += 0.12 + Math.abs(p.vx) * 0.09;
    if (p.inv > 0) p.inv--;

    if (p.y > DEATH_Y) respawn();
  }

  function updateEnemies() {
    const p = player;
    const pTop = p.y - (p.crouch ? H_CROUCH : H_STAND);
    for (const e of enemies) {
      if (!e.alive) continue;
      e.t++;
      let top, bottom, half;
      if (e.type === 'crab') {
        e.x += e.dir * 0.45;
        const g = groundAt(e.x);
        if (g !== null) e.y = g;
        half = 7; top = e.y - 11; bottom = e.y;
      } else {
        e.x += e.dir * 0.7;
        e.y = e.y0 + Math.sin(e.t * 0.07) * 7;
        half = 6; top = e.y - 5; bottom = e.y + 5;
      }
      if (e.x < e.min) { e.x = e.min; e.dir = 1; }
      else if (e.x > e.max) { e.x = e.max; e.dir = -1; }

      if (state !== 'play') continue;
      const overlap = p.x + HW > e.x - half && p.x - HW < e.x + half && p.y > top && pTop < bottom;
      if (!overlap) continue;
      if (p.vyPre > 0.3 && p.prevY <= top + 6) {
        e.alive = false;
        spawnParticles(e.x, (top + bottom) / 2, 12, ['#ffffff', '#dfe6ff', '#ffd23a'], 1.8, 0.02, 20);
        p.vy = -4.6;
        p.onGround = false; p.onPlat = null;
        sfx.stomp();
      } else {
        hurtPlayer(e.x);
      }
    }
  }

  function collectCoin(x, y) {
    coinCount++;
    spawnParticles(x, y, 5, ['#fff6c0', '#ffd23a'], 1.2, 0, 14);
    sfx.coin();
  }

  function updatePickups() {
    const p = player;
    const pTop = p.y - (p.crouch ? H_CROUCH : H_STAND);
    for (const c of coins) {
      if (c.taken) continue;
      if (Math.abs(p.x - c.x) < HW + 4 && c.y > pTop - 4 && c.y < p.y + 4) {
        c.taken = true;
        collectCoin(c.x, c.y);
      }
    }
    for (let i = lost.length - 1; i >= 0; i--) {
      const c = lost[i];
      c.age++;
      c.vy += 0.18;
      c.x += c.vx;
      c.y += c.vy;
      const g = groundAt(c.x);
      if (g !== null && c.y > g - 4 && c.vy > 0 && c.y < g + 8) {
        c.y = g - 4; c.vy *= -0.6; c.vx *= 0.9;
      }
      if (c.age > 200 || c.y > DEATH_Y) { lost.splice(i, 1); continue; }
      if (c.age > 25 && Math.abs(p.x - c.x) < HW + 4 && c.y > pTop - 4 && c.y < p.y + 4) {
        lost.splice(i, 1);
        collectCoin(c.x, c.y);
      }
    }
    for (const cp of checkpoints) {
      if (!cp.on && p.x >= cp.x) {
        cp.on = true;
        lastCP = cp;
        spawnParticles(cp.x, cp.y - 24, 14, ['#ffd23a', '#ff5a5a', '#ffffff'], 1.6, 0.03, 26);
        sfx.checkpoint();
      }
    }
    if (state === 'play' && p.x >= def.flagX - 6) triggerWin();
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.vy += q.g;
      q.x += q.vx;
      q.y += q.vy;
      q.vx *= 0.98;
      if (--q.life <= 0) particles.splice(i, 1);
    }
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.t++;
      c.y += c.vy;
      c.x += c.vx + Math.sin(c.t * 0.1 + c.ph) * 0.5;
      if (c.y > camY + VIEW_H + 10) confetti.splice(i, 1);
    }
  }

  const FIREWORK_COLORS = [
    ['#ff5a5a', '#ffd23a', '#ffffff'],
    ['#5affb0', '#6ab8ff', '#ffffff'],
    ['#ff8af0', '#b07aff', '#ffffff'],
    ['#ffd23a', '#ff9a3a', '#fff6c0'],
  ];
  const CONFETTI_COLORS = ['#ff5a5a', '#ffd23a', '#5affb0', '#6ab8ff', '#ff8af0', '#ffffff'];

  function updateWin() {
    winT++;
    const p = player;
    if (p.onGround && winT > 24) {
      p.vy = -4.3;
      p.onGround = false; p.onPlat = null;
    }
    if (winT % 28 === 1) {
      const fx = camX + rand(30, VIEW_W - 30);
      const fy = camY + rand(18, 80);
      spawnParticles(fx, fy, 40, FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)], 2.4, 0.03, 55);
      sfx.firework();
    }
    if (confetti.length < 220) {
      for (let i = 0; i < 2; i++) {
        confetti.push({
          x: camX + Math.random() * VIEW_W, y: camY - 4,
          vx: rand(-0.3, 0.3), vy: rand(0.5, 1.2),
          t: 0, ph: Math.random() * 6,
          c: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        });
      }
    }
    if (winT === 80) showWin();
  }

  function updateCamera(snap) {
    const p = player;
    look = approach(look, p.vx * 14, 1.5);
    const tx = clamp(p.x - VIEW_W * 0.42 + look, 0, Math.max(0, levelEnd - VIEW_W));
    const ty = clamp(p.y - 122, CAM_MIN_Y, CAM_MAX_Y);
    if (snap) { camX = tx; camY = ty; }
    else {
      camX += (tx - camX) * 0.12;
      camY += (ty - camY) * 0.08;
    }
  }

  function update() {
    tick++;
    const jp = jumpQueued;
    jumpQueued = false;
    if (state === 'title') return;
    updatePlatforms();
    updatePlayer(jp);
    updateEnemies();
    updatePickups();
    updateParticles();
    if (state === 'win') updateWin();
    updateCamera(false);
    if (fade > 0) fade--;
    if (shake > 0) shake--;
  }

  // ---------------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------------
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

  const dirtPattern = (() => {
    const c = document.createElement('canvas');
    c.width = 16; c.height = 16;
    const g = c.getContext('2d');
    g.fillStyle = '#b8682e'; g.fillRect(0, 0, 16, 16);
    g.fillStyle = '#9a5224'; g.fillRect(8, 0, 8, 8); g.fillRect(0, 8, 8, 8);
    g.fillStyle = '#d58a48'; g.fillRect(2, 2, 1, 1); g.fillRect(11, 12, 1, 1); g.fillRect(5, 13, 1, 1);
    g.fillStyle = '#7c3e18'; g.fillRect(12, 4, 1, 1); g.fillRect(3, 10, 1, 1);
    return ctx.createPattern(c, 'repeat');
  })();

  const SKY = ['#2a4fc4', '#3460d0', '#3f72dc', '#4b84e6', '#5a97ee', '#6aa9f4', '#7dbaf8', '#92caf9', '#a9d8fa', '#c2e6fb'];
  const CLOUDS = (() => {
    const r = mulberry32(3), out = [];
    for (let i = 0; i < 9; i++) out.push({ x: i * 72 + r() * 30, y: 10 + r() * 50, w: 24 + Math.floor(r() * 26) });
    return out;
  })();

  function drawSky() {
    const band = 13;
    for (let i = 0; i < SKY.length; i++) rect(0, i * band, VIEW_W, i === SKY.length - 1 ? VIEW_H : band, SKY[i]);
  }

  function drawClouds(cx) {
    const span = 680;
    for (const c of CLOUDS) {
      const x = Math.round(((c.x - cx * 0.12 - tick * 0.08) % span + span) % span) - 80;
      const y = c.y, w = c.w;
      rect(x + 4, y, w - 8, 4, '#ffffff');
      rect(x, y + 4, w, 6, '#ffffff');
      rect(x + 2, y + 10, w - 4, 2, '#d6ecff');
      rect(x + 8, y - 3, 10, 3, '#ffffff');
    }
  }

  const mtH = (x) => 46 + 16 * Math.sin(x * 0.011) + 11 * Math.sin(x * 0.027 + 2) + 6 * Math.sin(x * 0.063 + 1);
  const hillH = (x) => 22 + 10 * Math.sin(x * 0.021) + 6 * Math.sin(x * 0.05 + 1);

  function drawMountains(cx, cy) {
    const base = Math.round(128 - cy * 0.15);
    for (let sx = 0; sx < VIEW_W; sx++) {
      const wx = sx + cx * 0.2;
      const h = mtH(wx);
      const top = Math.round(base - h);
      rect(sx, top, 1, VIEW_H - top, mtH(wx + 1) > h ? '#8798e0' : '#6576c4');
      if (h > 60) rect(sx, top, 1, 2 + Math.round((h - 60) * 0.4), '#e8eeff');
    }
  }

  function drawHills(cx, cy) {
    const base = Math.round(146 - cy * 0.35);
    for (let sx = 0; sx < VIEW_W; sx++) {
      const wx = sx + cx * 0.45;
      const h = hillH(wx);
      const top = Math.round(base - h);
      rect(sx, top, 1, VIEW_H - top, hillH(wx + 1) > h ? '#3cb85c' : '#2a9a4a');
      rect(sx, top, 1, 1, '#6ad87a');
    }
  }

  function drawWater(cx, cy) {
    const wy = 182;
    if (wy > cy + VIEW_H) return;
    rect(cx, wy, VIEW_W, cy + VIEW_H - wy + 1, '#2b6fd6');
    rect(cx, wy + 6, VIEW_W, cy + VIEW_H - wy, '#235fc0');
    ctx.fillStyle = '#9fd4ff';
    const off = Math.floor(tick * 0.4);
    for (let x = cx; x < cx + VIEW_W; x++) {
      if (((x + off) & 15) < 6) ctx.fillRect(x, wy, 1, 1);
      if (((x - off + 7) & 31) < 4) ctx.fillRect(x, wy + 3, 1, 1);
    }
  }

  const groundTops = new Int16Array(512);
  function drawGround(cx, cy) {
    const bottom = cy + VIEW_H;
    for (let sx = 0; sx < VIEW_W; sx++) {
      const g = groundAt(cx + sx);
      groundTops[sx] = g === null ? -32768 : Math.round(g);
    }
    ctx.fillStyle = dirtPattern;
    for (let sx = 0; sx < VIEW_W; sx++) {
      const g = groundTops[sx];
      if (g !== -32768 && g + 4 < bottom) ctx.fillRect(cx + sx, g + 4, 1, bottom - g - 4);
    }
    for (let sx = 0; sx < VIEW_W; sx++) {
      const g = groundTops[sx];
      if (g === -32768) continue;
      const wx = cx + sx;
      const edgeL = groundAt(wx - 1) === null, edgeR = groundAt(wx + 1) === null;
      if (edgeL || edgeR) { rect(wx, g, 1, bottom - g, '#4a2a12'); continue; }
      rect(wx, g, 1, 1, (wx % 6) < 4 ? '#a6f06a' : '#5ccc3e');
      rect(wx, g + 1, 1, 2, '#4cbc38');
      rect(wx, g + 3, 1, 1, '#2e8a2c');
      rect(wx, g + 4, 1, 1, '#5a3418');
      const m = wx % 7;
      if (m === 0 || m === 3) rect(wx, g - 1, 1, 1, '#5ccc3e');
    }
  }

  function drawDeco(cx) {
    for (const d of def.deco) {
      if (d.x < cx - 30 || d.x > cx + VIEW_W + 30) continue;
      const x = d.x, y = d.y;
      if (d.type === 'flower') {
        const sw = Math.round(Math.sin(tick * 0.05 + x) * 0.8);
        rect(x, y - 5, 1, 5, '#2e8a2c');
        rect(x - 1 + sw, y - 8, 3, 3, d.c);
        rect(x + sw, y - 7, 1, 1, '#fff6a0');
      } else if (d.type === 'tuft') {
        rect(x - 2, y - 3, 1, 3, '#2e8a2c');
        rect(x, y - 5, 1, 5, '#46b85a');
        rect(x + 2, y - 3, 1, 3, '#2e8a2c');
      } else if (d.type === 'bush') {
        rect(x - 6, y - 5, 12, 5, '#2a8a3a');
        rect(x - 4, y - 8, 8, 3, '#2a8a3a');
        rect(x - 3, y - 7, 3, 1, '#46b85a');
        rect(x + 2, y - 4, 2, 1, '#46b85a');
      } else if (d.type === 'rock') {
        rect(x - 3, y - 3, 6, 3, '#8a8aa0');
        rect(x - 2, y - 4, 4, 1, '#a8a8bd');
        rect(x + 1, y - 2, 2, 1, '#6a6a80');
      } else if (d.type === 'palm') {
        let tx = x, ty = y;
        for (let i = 0; i < 10; i++) {
          tx = x + Math.round(Math.sin(i * 0.25) * 3);
          ty = y - 3 - i * 3;
          rect(tx - 1, ty, 3, 3, i % 2 ? '#8a5a2a' : '#a8703a');
        }
        const sway = Math.sin(tick * 0.03 + x) * 0.15;
        for (let a = 0; a < 6; a++) {
          const ang = -Math.PI + (a / 5) * Math.PI + sway;
          for (let k = 1; k < 9; k++) {
            rect(Math.round(tx + Math.cos(ang) * k), Math.round(ty + Math.sin(ang) * k * 0.6 + k * k * 0.07), 2, 2, k < 5 ? '#2fa84a' : '#45c25c');
          }
        }
        rect(tx - 1, ty + 2, 2, 2, '#6a3a1a');
        rect(tx + 2, ty + 2, 2, 2, '#6a3a1a');
      }
    }
  }

  function drawPlatforms() {
    for (const pl of platforms) {
      const x = Math.round(pl.x), y = Math.round(pl.y), w = pl.w;
      ctx.fillStyle = dirtPattern;
      ctx.fillRect(x, y + 4, w, 6);
      rect(x, y, w, 1, '#a6f06a');
      rect(x, y + 1, w, 2, '#4cbc38');
      rect(x, y + 3, w, 1, '#2e8a2c');
      rect(x, y + 10, w, 1, '#4a2a12');
      rect(x, y + 3, 1, 7, '#5a3418');
      rect(x + w - 1, y + 3, 1, 7, '#5a3418');
      if (pl.range) {
        rect(x + 4, y + 11, w - 8, 1, '#4a2a12');
        rect(x + w / 2 - 1, y + 11, 2, 3, '#4a2a12');
      }
    }
  }

  function drawCheckpoints() {
    for (const cp of checkpoints) {
      const x = cp.x, y = Math.round(cp.y);
      rect(x - 3, y - 2, 6, 2, '#5a5a70');
      rect(x - 1, y - 24, 2, 22, '#d8d8e8');
      rect(x, y - 24, 1, 22, '#a0a0b8');
      const c = cp.on ? ((tick >> 3) % 2 ? '#ff3b3b' : '#ffd23a') : '#3a5fe0';
      rect(x - 2, y - 28, 4, 4, c);
      rect(x - 1, y - 29, 2, 1, c);
      rect(x - 1, y - 27, 1, 1, '#ffffff');
    }
  }

  function drawFlag() {
    const fx = def.flagX;
    const gy = Math.round(groundAt(fx));
    rect(fx - 4, gy - 2, 8, 2, '#6a6a80');
    rect(fx - 1, gy - 54, 2, 52, '#e8e8f0');
    rect(fx, gy - 54, 1, 52, '#b0b0c4');
    rect(fx - 2, gy - 58, 4, 4, '#ffd23a');
    for (let i = 0; i < 22; i++) {
      const yo = Math.round(Math.sin(tick * 0.12 - i * 0.45) * 1.6 * (i / 21));
      for (let r = 0; r < 3; r++) {
        rect(fx + 1 + i, gy - 52 + yo + r * 4, 1, 4, (((i >> 2) + r) & 1) ? '#ffffff' : '#222233');
      }
    }
  }

  function drawCoin(cx, cy, sx) {
    for (let r = -4; r < 4; r++) {
      const yy = r + 0.5;
      const full = Math.sqrt(16 - yy * yy);
      const w = Math.max(1, Math.round(full * 2 * sx));
      const x0 = cx - (w >> 1);
      rect(x0, cy + r, w, 1, '#b0700c');
      if (w > 2 && r > -4 && r < 3) rect(x0 + 1, cy + r, w - 2, 1, '#ffd23a');
    }
    if (sx > 0.45) {
      const hx = cx - Math.round(sx * 2);
      rect(hx, cy - 2, 1, 2, '#fff6c0');
    }
  }

  function drawCoins(cx) {
    for (const c of coins) {
      if (c.taken || c.x < cx - 10 || c.x > cx + VIEW_W + 10) continue;
      drawCoin(c.x, c.y, Math.abs(Math.cos(tick * 0.07 + c.x * 0.05)));
    }
    for (const c of lost) {
      if (c.age > 140 && (c.age >> 2) % 2) continue;
      drawCoin(Math.round(c.x), Math.round(c.y), Math.abs(Math.cos(tick * 0.2 + c.age)));
    }
  }

  function drawEnemies(cx) {
    for (const e of enemies) {
      if (!e.alive || e.x < cx - 20 || e.x > cx + VIEW_W + 20) continue;
      const x = Math.round(e.x), y = Math.round(e.y);
      if (e.type === 'crab') {
        const step = (e.t >> 3) % 2;
        for (let i = 0; i < 3; i++) {
          const o = (i + step) % 2;
          rect(x - 7 + i * 2, y - 3 + o, 1, 3 - o, '#7a1010');
          rect(x + 2 + i * 2, y - 3 + (1 - o), 1, 2 + o, '#7a1010');
        }
        rect(x - 7, y - 8, 14, 5, '#e8402e');
        rect(x - 6, y - 9, 12, 1, '#e8402e');
        rect(x - 4, y - 9, 6, 1, '#ff8a6a');
        rect(x - 6, y - 4, 12, 1, '#a81e14');
        rect(x - 3, y - 12, 1, 3, '#a81e14');
        rect(x + 2, y - 12, 1, 3, '#a81e14');
        rect(x - 4, y - 14, 2, 2, '#ffffff');
        rect(x + 2, y - 14, 2, 2, '#ffffff');
        rect(x - 4 + (e.dir > 0 ? 1 : 0), y - 13, 1, 1, '#000000');
        rect(x + 2 + (e.dir > 0 ? 1 : 0), y - 13, 1, 1, '#000000');
        const cl = (e.t >> 4) % 2;
        rect(x - 11, y - 11 + cl * 2, 4, 4, '#ff5a3a');
        rect(x - 11, y - 12 + cl * 2, 2, 1, '#ff5a3a');
        rect(x + 7, y - 9 - cl * 2, 4, 4, '#ff5a3a');
        rect(x + 9, y - 10 - cl * 2, 2, 1, '#ff5a3a');
      } else {
        const f = e.dir;
        const B = (lx, ly, w, h, c) => rect(f > 0 ? x + lx : x - lx - w, y + ly, w, h, c);
        const flap = (e.t >> 2) % 2;
        B(-3, -7 + flap, 4, 3 - flap, 'rgba(235,248,255,0.9)');
        B(0, -8 + flap, 4, 3 - flap, 'rgba(235,248,255,0.9)');
        B(-5, -3, 10, 6, '#ffd23a');
        B(-2, -3, 2, 6, '#222233');
        B(1, -3, 1, 6, '#222233');
        B(4, -3, 3, 5, '#222233');
        B(5, -2, 1, 1, '#ffffff');
        B(-7, 0, 2, 1, '#222233');
        B(-4, -3, 1, 1, '#fff6a0');
      }
    }
  }

  const COL = {
    shirt: '#e8282e', shirtD: '#a9141b', skin: '#f3c39b', skinD: '#d39a72',
    jeans: '#2d55b0', jeansD: '#1f3c80', shoe: '#ffffff', shoeD: '#c8cad8',
    red: '#e8282e', redD: '#b01a20',
  };

  function drawPlayer() {
    const p = player;
    if (p.inv > 0 && state === 'play' && ((p.inv >> 2) % 2 === 0)) return;
    const ox = Math.round(p.x), oy = Math.round(p.y), f = p.face;
    const R = (lx, ly, w, h, c) => rect(f > 0 ? ox + lx : ox - lx - w, oy + ly, w, h, c);

    const leg = (hipX, hipY, fx, fy, back) => {
      const jc = back ? COL.jeansD : COL.jeans;
      const footTop = fy - 3;
      const span = Math.max(1, footTop - hipY);
      for (let ly = hipY; ly < footTop; ly++) {
        const t = (ly - hipY) / span;
        R(Math.round(hipX + (fx - hipX) * t) - 1, ly, 3, 1, jc);
      }
      R(fx - 2, fy - 3, 4, 1, back ? COL.shoeD : COL.shoe);
      R(fx - 2, fy - 2, 5, 1, back ? COL.redD : COL.red);
      R(fx - 2, fy - 1, 6, 1, back ? COL.shoeD : COL.shoe);
    };

    let hipY = -8, bob = 0;
    let backFoot = [-2, 0], frontFoot = [2, 0];
    let backArm = 0, frontArm = 0, armsUp = false;
    let crouch = false;

    if (p.hurt) {
      backFoot = [-4, -1]; frontFoot = [4, -2]; armsUp = true;
    } else if (!p.onGround) {
      if (p.vy < 0) { backFoot = [-2, -1]; frontFoot = [3, -3]; armsUp = true; }
      else { backFoot = [-3, 0]; frontFoot = [3, -1]; }
    } else if (p.crouch) {
      crouch = true; hipY = -5; backFoot = [-3, 0]; frontFoot = [3, 0];
    } else if (Math.abs(p.vx) > 0.1) {
      const s = Math.sin(p.runT), c = Math.cos(p.runT);
      const stride = Math.abs(p.vx) > 4.5 ? 5 : 4;
      frontFoot = [Math.round(1 + s * stride), -Math.round(Math.max(0, c) * 3)];
      backFoot = [Math.round(-1 - s * stride), -Math.round(Math.max(0, -c) * 3)];
      frontArm = Math.round(-s * 3);
      backArm = -frontArm;
      bob = Math.abs(s) > 0.7 ? 0 : -1;
    }

    hipY += bob;
    const top = hipY - (crouch ? 6 : 7);

    leg(-1, hipY, backFoot[0], backFoot[1], true);
    if (armsUp) R(-5, top - 5, 2, 6, COL.skinD);
    else {
      R(-1 + backArm, top + 1, 2, 2, COL.shirtD);
      R(-1 + backArm, top + 3, 2, 3, COL.skinD);
    }
    R(-3, hipY - 1, 6, 2, COL.jeans);
    R(-4, top, 8, hipY - 1 - top, COL.shirt);
    R(-4, top, 2, hipY - 1 - top, COL.shirtD);
    R(1, top + 2, 2, 2, '#ffffff');
    leg(1, hipY, frontFoot[0], frontFoot[1], false);
    if (armsUp) {
      R(2, top, 3, 2, COL.shirt);
      R(3, top - 5, 2, 6, COL.skin);
    } else {
      R(0 + frontArm, top + 1, 3, 2, COL.shirt);
      R(1 + frontArm, top + 3, 2, 3, COL.skin);
    }

    const chinY = top + 2;
    if (headR) {
      const hx = f > 0 ? ox + 2 - HEAD_FACE_X : ox - 2 - (HEAD_W - HEAD_FACE_X);
      const hy = oy + chinY - HEAD_CHIN_Y;
      ctx.drawImage(f > 0 ? headR : headL, hx, hy);
    } else {
      R(-7, chinY - 16, 14, 16, COL.skin);
      R(-7, chinY - 18, 14, 4, '#2a6ae8');
    }
  }

  function drawParticles() {
    for (const q of particles) {
      if (q.life < 8 && (q.life & 1)) continue;
      rect(Math.round(q.x), Math.round(q.y), q.s, q.s, q.c);
    }
    for (const c of confetti) {
      const w = ((c.t + Math.floor(c.ph * 10)) >> 3) % 2 ? 3 : 1;
      rect(Math.round(c.x), Math.round(c.y), w, 2, c.c);
    }
  }

  const GLYPHS = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111',
    '3': '111001111001111', '4': '101101111001001', '5': '111100111001111',
    '6': '111100111101111', '7': '111001010010010', '8': '111101111101111',
    '9': '111101111001111', 'x': '000101010101000',
  };
  function drawText(str, x, y, s, col) {
    ctx.fillStyle = col;
    for (let i = 0; i < str.length; i++) {
      const g = GLYPHS[str[i]];
      if (!g) continue;
      for (let k = 0; k < 15; k++) {
        if (g[k] === '1') ctx.fillRect(x + i * 4 * s + (k % 3) * s, y + Math.floor(k / 3) * s, s, s);
      }
    }
  }

  function drawHUD() {
    drawCoin(12, 12, 1);
    const txt = 'x' + coinCount;
    drawText(txt, 21, 8, 2, '#1a1030');
    drawText(txt, 20, 7, 2, '#ffffff');
  }

  function render() {
    let sx = 0, sy = 0;
    if (shake > 0) { sx = Math.round(rand(-2, 2)); sy = Math.round(rand(-2, 2)); }
    const cx = Math.round(camX) + sx, cy = Math.round(camY) + sy;

    drawSky();
    drawClouds(cx);
    drawMountains(cx, cy);
    drawHills(cx, cy);

    ctx.save();
    ctx.translate(-cx, -cy);
    drawWater(cx, cy);
    drawGround(cx, cy);
    drawDeco(cx);
    drawPlatforms();
    drawCheckpoints();
    drawFlag();
    drawCoins(cx);
    drawEnemies(cx);
    drawPlayer();
    drawParticles();
    ctx.restore();

    if (state !== 'title') drawHUD();
    if (fade > 0) {
      ctx.fillStyle = `rgba(255,255,255,${fade / 24})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  // ---------------------------------------------------------------------------
  // Main loop (fixed 60 Hz timestep)
  // ---------------------------------------------------------------------------
  const STEP = 1 / 60;
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;
    if (dt < 0) dt = 0;
    acc += dt;
    const paused = portraitMQ.matches;
    while (acc >= STEP) {
      if (!paused) update();
      acc -= STEP;
    }
    render();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  if (/[?&]debug\b/.test(location.search)) {
    window.__dd = {
      get state() { return state; },
      get player() { return player; },
      get coins() { return coinCount; },
      flagX: def.flagX,
      groundAt,
      teleport(x) { player = newPlayer(x); updateCamera(true); },
    };
  }

  resetLevel();
  resize();
  requestAnimationFrame(frame);
})();
</script>
