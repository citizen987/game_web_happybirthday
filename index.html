<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>David Dash</title>
<link rel="icon" href="assets/head.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-state="title">
<canvas id="game" width="320" height="180"></canvas>

<div id="touch">
  <div class="tbtn" data-btn="left"><svg viewBox="0 0 24 24"><path d="M17 3 L5 12 L17 21 Z"/></svg></div>
  <div class="tbtn" data-btn="down"><svg viewBox="0 0 24 24"><path d="M3 7 L12 19 L21 7 Z"/></svg></div>
  <div class="tbtn" data-btn="right"><svg viewBox="0 0 24 24"><path d="M7 3 L19 12 L7 21 Z"/></svg></div>
  <div class="tbtn" data-btn="jump"><svg viewBox="0 0 24 24"><path d="M12 3 L22 14 L15.5 14 L15.5 21 L8.5 21 L8.5 14 L2 14 Z"/></svg></div>
</div>

<div id="start" class="overlay">
  <img src="assets/head.png" alt="" class="title-face">
  <div class="title">DAVID DASH</div>
  <p class="blink">Toca o pulsa una tecla para empezar</p>
  <p class="help">Flechas / WASD para moverte &middot; Espacio o Z para saltar &middot; Abajo corriendo para rodar &middot; Abajo + saltar para cargar &middot; M silencia</p>
</div>

<div id="win" class="overlay hidden" data-mode="win">
  <img src="assets/head.png" alt="David" class="big-face">
  <div id="congrats"></div>
  <div id="score-card" class="score-card">
    <div class="stats">
      <div class="stat"><span class="stat-label">Monedas</span><span class="stat-value" id="score-coins">0</span></div>
      <div class="stat"><span class="stat-label">Tiempo</span><span class="stat-value" id="score-time">0:00</span></div>
      <div class="stat stat-total"><span class="stat-label">Puntos</span><span class="stat-value" id="score-total">0</span></div>
    </div>
    <div id="score-letters" class="score-letters" aria-label="Letras conseguidas"></div>
    <p id="score-best" class="score-best"></p>
    <p id="end-subtitle" class="end-subtitle"></p>
    <div class="actions">
      <button id="share" type="button" class="btn btn-primary">🎁 Compartir felicitación</button>
      <button id="again" type="button" class="btn">Volver a jugar</button>
    </div>
    <a id="download" class="download hidden">Descargar tarjeta</a>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<div id="banner" class="banner hidden" aria-live="polite"></div>

<button id="mute" type="button" aria-label="Silenciar"></button>

<div id="rotate">
  <svg viewBox="0 0 48 48"><rect x="14" y="4" width="20" height="40" rx="3"/><line x1="21" y1="38" x2="27" y2="38"/></svg>
  <p>Gira el móvil para jugar</p>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
